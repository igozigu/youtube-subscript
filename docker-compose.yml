version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yt-transcript-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${OUTPUT_DIR:-./data/output}:/app/data/output
      # 쿠키 파일 마운트 (선택사항)
      # - ./cookies.txt:/app/cookies.txt:ro
    environment:
      - DEFAULT_LANGUAGES=${DEFAULT_LANGUAGES:-ko,en}
      - FETCH_DELAY_MS=${FETCH_DELAY_MS:-1500}
      - MAX_CONCURRENT=${MAX_CONCURRENT:-3}
      - OUTPUT_DIR=/app/data/output
      # - COOKIE_FILE_PATH=/app/cookies.txt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yt-transcript-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
